<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <!-- <meta name="robots" content="index, follow"> -->
    <!-- Esto es solo para indexar en google -->
    <meta name="theme-color" content="#F500A8" />
    <meta
      name="description"
      content="Time Tracking Dashboard challenge by Frontend Mentor"
    />
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <script src="index.js" defer></script>
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <section class="mainCard">
        <div class="profileCard">
          <div class="picture-Container">
            <img
              class="profilePicture"
              src="./images/image-jeremy.png"
              alt="Profile picture"
            />
          </div>
          <div class="report-cont">
            <p>Report for</p>
            <h1>Jeremy Robson</h1>
          </div>
        </div>
        <nav>
          <button>Daily</button>
          <button>Weekly</button>
          <button>Monthly</button>
        </nav>
      </section>

      <!-- All activities cards 🧷 -->
      <!-- Work 👷‍♂️ -->
      <section class="activities">
        <article class="work">
          <div class="info">
            <div class="header-card">
              <h2>Work</h2>
              <button class="dots">
                <img src="./images/icon-ellipsis.svg" alt="dots" />
              </button>
            </div>
            <div class="hours-container">
              <!-- weekly -->
              <p class="current-hours">
                <time datetime="PT19H">19hrs</time>
              </p>
              <!-- weekly -->
              <p class="previous-hours">
                <time datetime="PT52H">Last Week - 52hrs</time>
              </p>
            </div>
          </div>
        </article>

        <!-- Play 👾 -->
        <article class="play">
          <div class="info">
            <div class="header-card">
              <h2>Play</h2>
              <button class="dots">
                <img src="./images/icon-ellipsis.svg" alt="dots" />
              </button>
            </div>
            <div class="hours-container">
              <!-- weekly -->
              <p class="current-hours">
                <time datetime="PT67H">67hrs</time>
              </p>
              <!-- weekly -->
              <p class="previous-hours">
                <time datetime="PT2H">Last Week - 2hrs</time>
              </p>
            </div>
          </div>
        </article>

        <!-- Study 👩‍🎓 -->
        <article class="study">
          <div class="info">
            <div class="header-card">
              <h2>Study</h2>
              <button class="dots">
                <img src="./images/icon-ellipsis.svg" alt="dots" />
              </button>
            </div>
            <div class="hours-container">
              <!-- weekly -->
              <p class="current-hours">
                <time datetime="PT17H">17hrs</time>
              </p>
              <!-- weekly -->
              <p class="previous-hours">
                <time datetime="PT76H">Last Week - 76hrs</time>
              </p>
            </div>
          </div>
        </article>

        <!-- Exercise 🏋️‍♂️ -->
        <article class="exercise">
          <div class="info">
            <div class="header-card">
              <h2>Exercise</h2>
              <button class="dots">
                <img src="./images/icon-ellipsis.svg" alt="dots" />
              </button>
            </div>
            <div class="hours-container">
              <p class="current-hours">
                <time datetime="PT46H">46hrs</time>
              </p>
              <!-- weekly -->
              <p class="previous-hours">
                <time datetime="PT82H">Last Week - 82hrs</time>
              </p>
              <!-- weekly -->
            </div>
          </div>
        </article>

        <!-- Social 😀 -->
        <article class="social">
          <div class="info">
            <div class="header-card">
              <h2>Social</h2>
              <button class="dots">
                <img src="./images/icon-ellipsis.svg" alt="dots" />
              </button>
            </div>
            <div class="hours-container">
              <p class="current-hours">
                <time datetime="PT22H">22hrs</time>
              </p>
              <!-- weekly -->
              <p class="previous-hours">
                <time datetime="PT11H">Last Week - 11hrs</time>
              </p>
              <!-- weekly -->
            </div>
          </div>
        </article>

        <!-- Selfcare 🥗 -->
        <article class="selfcare">
          <div class="info">
            <div class="header-card">
              <h2>Self Care</h2>
              <button class="dots">
                <img src="./images/icon-ellipsis.svg" alt="dots" />
              </button>
            </div>
            <div class="hours-container">
              <p class="current-hours">
                <time datetime="PT31H">31hrs</time>
              </p>
              <!-- weekly -->
              <p class="previous-hours">
                <time datetime="PT31H">Last Week - 31hrs</time>
              </p>
              <!-- weekly -->
            </div>
          </div>
        </article>
      </section>
    </main>
    <div class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener"
        >Frontend Mentor</a
      >. Coded by <a href="#">Carlos Ali</a>.
    </div>
  </body>
</html>
